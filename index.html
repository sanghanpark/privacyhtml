<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>앱 지원 페이지</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 20px; line-height: 1.7; color: #222; }
    h1, h2 { color: #111; }
    .box { background: #f7f7f7; border-radius: 12px; padding: 18px; margin: 18px 0; }
    a { color: #0b57d0; }
    code { background: #eee; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>앱 지원 페이지</h1>
  <p>이 페이지는 Android 앱의 고객지원 및 개인정보처리방침 안내를 위해 제공됩니다.</p>

  <div class="box">
    <h2>지원 이메일</h2>
    <p><a href="mailto:your-support-email@example.com">your-support-email@example.com</a></p>
  </div>

  <div class="box">
    <h2>개인정보처리방침</h2>
    <p><a href="./privacy.html">개인정보처리방침 보기</a></p>
  </div>

  <div class="box">
    <h2>수정해야 할 항목</h2>
    <ul>
      <li><code>your-support-email@example.com</code> → 실제 운영 지원 이메일로 변경</li>
      <li>앱 이름, 개발자명, 시행일, 수집 항목, 보관 기간을 실제 내용으로 수정</li>
    </ul>
  </div>
</body>
</html>
