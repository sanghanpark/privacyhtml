name: SK Hynix strategy backtest

on:
  push:
    branches: [main]
    paths:
      - 'analysis/backtest_v2.py'
      - '.github/workflows/backtest.yml'
  pull_request:
    branches: [main]
    paths:
      - 'analysis/backtest_v2.py'
      - '.github/workflows/backtest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas numpy requests yfinance
      - name: Run backtest
        run: python analysis/backtest_v2.py
      - name: Commit validated results
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/output/results.json analysis/output/summary.csv
          git diff --cached --quiet && exit 0
          git commit -m "Update SK hynix backtest results"
          git push
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skhynix-backtest-results
          path: analysis/output
          if-no-files-found: warn
